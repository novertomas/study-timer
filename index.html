<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Timer</title>


  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, sans-serif; color: white;
      background: linear-gradient(160deg, #0f0a24, #2b1458);
    }
    h1 { margin: 0; font-size: 28px; }
    .ring { position: relative; width: 260px; height: 260px; }
    svg { transform: rotate(-90deg); }
    circle { fill: none; stroke-width: 14; }
    .bg { stroke: rgba(255,255,255,0.12); }
    .fg { stroke: #7c5cff; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s; }
    #time { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 56px; font-weight: 700; }
    .modes button, .controls button {
      border: none; border-radius: 12px; padding: 12px 20px; font-size: 16px;
      color: white; background: rgba(255,255,255,0.12); cursor: pointer;
    }
    .modes button.active { background: #7c5cff; }
    .controls button.main { background: #7c5cff; font-weight: 700; }
    .modes, .controls { display: flex; gap: 10px; }
    #count { opacity: 0.8; }
    body {
      background: linear-gradient(135deg, #0f0a24, #2b1458, #123a63, #0f0a24);
      background-size: 400% 400%;
      animation: bgMove 18s ease infinite;
    }
    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1, .modes, .ring, .controls, #count { animation: fadeUp 0.7s ease both; }
    .modes { animation-delay: 0.1s; }
    .ring { animation-delay: 0.2s; }
    .controls { animation-delay: 0.3s; }
    #count { animation-delay: 0.4s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ring { border-radius: 50%; transition: box-shadow 0.4s; }
    body.running .ring { animation: glow 2s ease-in-out infinite; }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(124, 92, 255, 0.3); }
      50% { box-shadow: 0 0 60px rgba(124, 92, 255, 0.8); }
    }
    button { transition: transform 0.15s, background 0.2s; }
    button:hover { transform: translateY(-3px) scale(1.05); }
    button:active { transform: scale(0.95); }
    #time { text-shadow: 0 0 20px rgba(124, 92, 255, 0.7); }
    .musicbtn { border: none; border-radius: 12px; padding: 10px 18px; color: white;
      background: rgba(255,255,255,0.12); font-size: 15px; cursor: pointer; }
    .tasks { width: min(360px, 90vw); background: rgba(255,255,255,0.08);
      border-radius: 16px; padding: 16px; backdrop-filter: blur(8px); }
    .tasks h2 { margin: 0 0 10px; font-size: 20px; }
    .addrow { display: flex; gap: 8px; }
    .addrow input { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 15px; }
    .addrow button { border: none; border-radius: 10px; padding: 10px 16px; background: #7c5cff; color: white; }
    #taskList { list-style: none; padding: 0; margin: 12px 0 0; }
    #taskList li { display: flex; align-items: center; gap: 10px; padding: 8px 4px;
      animation: fadeUp 0.4s ease both; }
    #taskList li.done span { text-decoration: line-through; opacity: 0.5; }
    #taskList li span { flex: 1; }
    #taskList li button { border: none; background: none; color: #ff7a90; font-size: 18px; cursor: pointer; }
  </style>

</head>
<body>
<h1>Study Timer</h1>

<div class="modes">
  <button id="m-study" class="active" onclick="setMode('study')">Study 25</button>
  <button id="m-break" onclick="setMode('break')">Break 5</button>
</div>

<div class="ring">
  <svg width="260" height="260">
    <circle class="bg" cx="130" cy="130" r="115"></circle>
    <circle class="fg" id="fg" cx="130" cy="130" r="115"></circle>
  </svg>
  <div id="time">25:00</div>
</div>

<div class="controls">
  <button class="main" id="start" onclick="toggle()">Start</button>
  <button onclick="reset()">Reset</button>
</div>

<p id="count"></p>
<button class="musicbtn" id="musicBtn" onclick="toggleMusic()">Music: off</button>
<audio id="music" src="lofi.mp3" loop></audio>

<div class="tasks">
  <h2>Tasks</h2>
  <div class="addrow">
    <input id="taskInput" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()">
    <button onclick="addTask()">Add</button>
  </div>
  <ul id="taskList"></ul>
</div>
<script>
  const MODES = { study: 25 * 60, break: 5 * 60 };
  const CIRC = 2 * Math.PI * 115;
  let mode = "study";
  let left = MODES[mode];
  let timer = null;

  const fg = document.getElementById("fg");
  fg.style.strokeDasharray = CIRC;

  function today() { return new Date().toDateString(); }
  function getSessions() {
    const saved = JSON.parse(localStorage.getItem("sessions") || "{}");
    return saved.day === today() ? saved.n : 0;
  }
  function addSession() {
    localStorage.setItem("sessions", JSON.stringify({ day: today(), n: getSessions() + 1 }));
  }

  function render() {
    const m = String(Math.floor(left / 60)).padStart(2, "0");
    const s = String(left % 60).padStart(2, "0");
    document.getElementById("time").textContent = m + ":" + s;
    document.title = m + ":" + s + " - Study Timer";
    fg.style.strokeDashoffset = CIRC * (1 - left / MODES[mode]);
    fg.style.stroke = mode === "study" ? "#7c5cff" : "#3ddc97";
    document.getElementById("count").textContent = "Sessions today: " + getSessions();
  }

  function beep() {
    const ctx = new AudioContext();
    [0, 0.25, 0.5].forEach(t => {
      const o = ctx.createOscillator();
      o.frequency.value = 880;
      o.connect(ctx.destination);
      o.start(ctx.currentTime + t);
      o.stop(ctx.currentTime + t + 0.15);
    });
  }

  function tick() {
    left--;
    if (left <= 0) {
      clearInterval(timer);
      timer = null;
      beep();
      if (mode === "study") addSession();
      document.getElementById("start").textContent = "Start";
      setMode(mode === "study" ? "break" : "study");
      return;
    }
    render();
  }

  function toggle() {
    if (timer) {
      clearInterval(timer);
      timer = null;
      document.getElementById("start").textContent = "Start";
    } else {
      timer = setInterval(tick, 1000);
      document.getElementById("start").textContent = "Pause";
    }
  }

  function reset() {
    clearInterval(timer);
    timer = null;
    left = MODES[mode];
    document.getElementById("start").textContent = "Start";
    render();
  }

  function setMode(m) {
    mode = m;
    document.getElementById("m-study").classList.toggle("active", m === "study");
    document.getElementById("m-break").classList.toggle("active", m === "break");
    reset();
  }
  let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";
    tasks.forEach((t, i) => {
      const li = document.createElement("li");
      if (t.done) li.classList.add("done");

      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = t.done;
      box.onchange = () => { tasks[i].done = box.checked; saveTasks(); renderTasks(); };

      const text = document.createElement("span");
      text.textContent = t.text;

      const del = document.createElement("button");
      del.textContent = "x";
      del.onclick = () => { tasks.splice(i, 1); saveTasks(); renderTasks(); };

      li.append(box, text, del);
      list.appendChild(li);
    });
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    const value = input.value.trim();
    if (!value) return;
    tasks.push({ text: value, done: false });
    input.value = "";
    saveTasks();
    renderTasks();
  }

  function toggleMusic() {
    const audio = document.getElementById("music");
    const btn = document.getElementById("musicBtn");
    if (audio.paused) {
      audio.play();
      btn.textContent = "Music: on";
    } else {
      audio.pause();
      btn.textContent = "Music: off";
    }
  }

  renderTasks();
  render();
</script>
</body>
</html>
